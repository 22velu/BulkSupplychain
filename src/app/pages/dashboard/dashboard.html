<div class="dashboard-container">

  <h2 class="mb-4">Inventory Dashboard</h2>

  <div class="grid">

    <div 
      class="card" 
      *ngFor="let product of products"
      (click)="goToVendor(product)"  
    >
      <h4>{{ product.name }}</h4>
      <p class="qty">{{ product.quantity }}</p>
      <span>{{ product.unit }}</span>
    </div>

  </div>

</div>
