<!-- src/app/features/auth/register/register.component.html -->

<div class="auth-container">
  <div class="card p-4 shadow">
    <h2 class="text-center mb-4">Register</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <input class="form-control mb-3" placeholder="Name" formControlName="name" />
      <input class="form-control mb-3" placeholder="Email" formControlName="email" />
      <input type="password" class="form-control mb-3" placeholder="Password" formControlName="password" />

      <select class="form-control mb-3" formControlName="role">
        <option value="buyer">Buyer</option>
        <option value="supplier">Supplier</option>
      </select>

      <div *ngIf="errorMsg" class="alert alert-danger">
        {{ errorMsg }}
      </div>

      <button class="btn btn-primary w-100" [disabled]="isLoading">
        {{ isLoading ? 'Registering...' : 'Register' }}
      </button>

      <div class="text-center mt-3">
        <a routerLink="/login", routerLinkActive="active">Already have an account?</a>
      </div>

    </form>
  </div>
</div>
